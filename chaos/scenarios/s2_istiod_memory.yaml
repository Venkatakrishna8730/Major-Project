apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: s2-istiod-memory
  namespace: istio-system
spec:
  mode: one
  selector:
    namespaces:
      - istio-system
    labelSelectors:
      app: istiod
  stressors:
    memory:
      workers: 1
      size: "256MB"
  duration: "10m"
