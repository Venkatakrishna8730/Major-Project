apiVersion: v1
kind: ServiceAccount
metadata:
  name: mtls-predictor-sa
  namespace: istio-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mtls-predictor-role
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mtls-predictor-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mtls-predictor-role
subjects:
  - kind: ServiceAccount
    name: mtls-predictor-sa
    namespace: istio-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtls-predictor
  namespace: istio-system
  labels:
    app: mtls-predictor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mtls-predictor
  template:
    metadata:
      labels:
        app: mtls-predictor
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: mtls-predictor-sa
      containers:
        - name: predictor
          image: python:3.10-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              pip install --no-cache-dir fastapi uvicorn xgboost scikit-learn pandas pyarrow joblib pydantic && \
              python /app/service/main.py
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: SERVICE_PORT
              value: "8000"
            - name: REMEDIATION_THRESHOLD
              value: "0.75"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: app-code
              mountPath: /app
      volumes:
        - name: app-code
          hostPath:
            path: /home/user/Documents/SeriviceMeshML
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: mtls-predictor
  namespace: istio-system
  labels:
    app: mtls-predictor
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: mtls-predictor
